<body>

<div class="admin-card">

<div class="badge">

<h1>JIYA'S CAKE</h1>

<p class="sub">Sign in with your admin account to manage orders.</p>

<form id="adminLoginForm">

</div>

<!-- ============================================================
     FIREBASE SETUP — same project as the rest of the site.

     HOW ADMIN ACCESS WORKS:
     Firebase Auth has no built-in idea of "admin" — anyone with an
     account is just a regular user. So we keep a separate Firestore
     collection called "admins", where the document ID is the admin's
     UID. If a signed-in user's UID has a matching document there,
     they're treated as an admin; otherwise they're signed back out.

     TO MAKE YOURSELF AN ADMIN:
     1. Register a normal account first via register.html (or sign in
        with Google once) using the email you want to use as admin.
     2. Firebase Console → Authentication → Users tab → copy that
        account's User UID (long string like "aB3xY...").
     3. Firebase Console → Firestore Database → Data tab → Start
        collection → collection ID: admins
     4. Document ID: paste the UID you copied. Add one field:
        field name: email, type: string, value: (the admin's email)
     5. Save. That account can now log in here.

     FIRESTORE RULES — paste this under Firestore → Rules, replacing
     what's there (this also covers the "users" and "orders"
     collections used elsewhere on the site):

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {

         function isAdmin() {
           return request.auth != null &&
             exists(/databases/$(database)/documents/admins/$(request.auth.uid));
         }

         match /users/{userId} {
           allow read, write: if request.auth != null && request.auth.uid == userId;
         }

         match /admins/{adminId} {
           allow read: if request.auth != null && request.auth.uid == adminId;
           allow write: if false;
         }

         match /orders/{orderId} {
           allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
           allow read: if request.auth != null &&
             (resource.data.uid == request.auth.uid || isAdmin());
           allow update: if isAdmin();
           allow delete: if false;
         }
       }
     }
     ============================================================ -->

<script>

function showFormError(msg){

const el=document.getElementById("formError");

el.innerHTML=msg;

el.classList.add("show");

}

function hideFormError(){

document.getElementById("formError").classList.remove("show");

}

document.getElementById("adminLoginForm").addEventListener("submit",function(e){

e.preventDefault();

hideFormError();

const email=document.getElementById("email").value.trim();

const pass=document.getElementById("password").value;

if(email===""||pass===""){

showFormError("Please enter both email and password.");

return;

}

const submitBtn=document.getElementById("submitBtn");

submitBtn.disabled=true;

submitBtn.innerHTML="Checking...";

auth.signInWithEmailAndPassword(email,pass).then(function(cred){

/* Logged in as a regular Firebase user — now check the admins

   collection before letting them anywhere near the dashboard */

return db.collection("admins").doc(cred.user.uid).get();

}).then(function(doc){

if(doc.exists){

window.location.href="admin.html";

}else{

auth.signOut();

submitBtn.disabled=false;

submitBtn.innerHTML="Sign In as Admin";

showFormError("This account doesn't have admin access.");

}

}).catch(function(err){

submitBtn.disabled=false;

submitBtn.innerHTML="Sign In as Admin";

showFormError(err.message);

});

});

</script>
